name: bm25_only
description: "BM25 lexical retrieval only (used in Experiment 1: dense vs BM25 vs hybrid)."
dataset_path: datasets/golden/v1.json
seed: 1337
retrieval:
  strategy: bm25
  top_k: 5
  chunk_size: 400
  chunk_overlap: 50
generation:
  provider: deterministic_local
  max_context_chunks: 5
  refuse_below_evidence_score: 0.15
