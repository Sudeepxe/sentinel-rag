[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sentinel-rag"
version = "1.0.0"
description = "Reliability infrastructure for Retrieval-Augmented Generation systems."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "Sentinel-RAG contributors" }]
keywords = ["rag", "evaluation", "retrieval", "llm", "reliability", "adversarial-testing"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "pydantic>=2.7",
    "typer>=0.12",
    "rich>=13.7",
    "fastapi>=0.111",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "numpy>=1.26",
    "PyYAML>=6.0",
    "jinja2>=3.1",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "hypothesis>=6.100",
    "ruff>=0.5",
    "mypy>=1.10",
    "bandit>=1.7",
]
embeddings = [
    "sentence-transformers>=3.0",
]
providers = [
    "openai>=1.30",
    "anthropic>=0.30",
]
observability = [
    "opentelemetry-sdk>=1.25",
    "prometheus-client>=0.20",
]

[project.scripts]
sentinel = "sentinel.cli.main:app"

[tool.hatch.build.targets.wheel]
packages = ["src/sentinel"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
markers = [
    "integration: integration tests",
    "adversarial: adversarial/security tests",
    "slow: slow-running tests",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
disallow_untyped_defs = false
warn_unused_ignores = true
exclude = ["tests/"]

[tool.bandit]
exclude_dirs = ["tests", ".venv"]
